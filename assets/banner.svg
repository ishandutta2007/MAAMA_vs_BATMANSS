<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Glowing gradients for MAAMA (Blue/Cyan) -->
    <linearGradient id="maamaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glowing gradients for BATMANSS (Red/Orange/Purple) -->
    <linearGradient id="batmanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- Grid pattern for futuristic tech vibe -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Abstract Dynamic Tech Elements (financial charts/waves) -->
  <path d="M 0 300 Q 300 150 600 250 T 1200 100" fill="none" stroke="url(#maamaGrad)" stroke-width="4" opacity="0.3" />
  <path d="M 0 250 Q 400 350 800 150 T 1200 300" fill="none" stroke="url(#batmanGrad)" stroke-width="3" opacity="0.25" />

  <!-- Pulsing dynamic nodes -->
  <circle cx="300" cy="200" r="6" fill="#00f2fe" filter="url(#glowCyan)">
    <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="220" r="6" fill="#ff0844" filter="url(#glowRed)">
    <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="120" r="5" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Title Text -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- MAAMA vs BATMANSS -->
    <text font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="72" letter-spacing="4">
      <tspan fill="url(#maamaGrad)" filter="url(#glowCyan)">MAAMA</tspan>
      <tspan fill="#ffffff"> vs </tspan>
      <tspan fill="url(#batmanGrad)" filter="url(#glowRed)">BATMANSS</tspan>
    </text>
    <!-- Subtitle -->
    <text y="60" fill="rgba(255, 255, 255, 0.7)" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="600" font-size="20" letter-spacing="8">
      THE ULTIMATE TECH MARKET CAP BATTLE
    </text>
  </g>

  <!-- Left Sidebar (MAAMA details) -->
  <g transform="translate(80, 320)" fill="rgba(255, 255, 255, 0.5)" font-family="monospace" font-size="14">
    <text>M.A.A.M.A : Microsoft • Apple • Alphabet • Meta • Amazon</text>
  </g>

  <!-- Right Sidebar (BATMANSS details) -->
  <g transform="translate(730, 320)" fill="rgba(255, 255, 255, 0.5)" font-family="monospace" font-size="14">
    <text>B.A.T.M.A.N.S.S : Broadcom • AMD • Tesla • Micron • ASML • Nvidia • Samsung • SK Hynix</text>
  </g>
</svg>
